server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Content-hashed build assets never change under a given name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SAME-ORIGIN API PROXY.
  #
  # The SPA calls /api/* on its OWN origin and nginx forwards to the backend container, so one
  # public hostname serves the whole app and there is no browser CORS at all.
  #
  # This follows the sibling Ligretto deployment, which started split-origin
  # (ligrettoapi.larskluijtmans.com) and moved off it because that hostname's DNS proved
  # unreliable. A second public hostname is still supported — the backend's CORS_ORIGINS lists
  # the web origin — but it is no longer required for the app to work.
  location /api/ {
    proxy_pass http://elestrals-api:9000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
  }

  location / {
    # connect-src: the backend is same-origin via the proxy above ('self'); the only cross-origin
    # call the app makes is PKCE login against the platform's login-api. Without that host listed,
    # react-auth reports "unable to reach the authentication service".
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://auth.aangifteportal.nl; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # index.html is never cached: the browser revalidates every load, so a redeploy pointing at
    # new hashed assets reaches users on their next normal reload without a hard refresh.
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}

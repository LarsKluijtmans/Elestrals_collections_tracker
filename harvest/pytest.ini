[pytest]
# `pythonpath` is relative to rootdir, so `pytest` works both from `harvest/` and from the repo
# root as `pytest harvest/tests`. Without it the suite only passes when the cwd happens to be
# `harvest/`, which bites in CI rather than locally — the same lesson backend/pytest.ini records.
pythonpath = .
testpaths = tests
addopts = -q
markers =
    mysql: needs a real MySQL with the two-user grant setup; skipped on the SQLite path

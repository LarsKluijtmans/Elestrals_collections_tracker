[pytest]
# `pythonpath` is relative to rootdir (this directory), so `pytest` works both from
# `backend/` and from the repo root as `pytest backend/tests` — pytest resolves rootdir from
# the arguments' common ancestor and finds this file either way. Without it the suite only
# passes when the cwd happens to be `backend/`, which bites in CI rather than locally.
pythonpath = .
testpaths = tests
addopts = -q
